<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guacd-TS Session Demo</title>
    <!-- Load guacamole-common-js (ESM default export) and expose as global Guacamole -->
    <script type="module">
      import Guacamole from '/vendor/guacamole-common-js/esm/guacamole-common.js';
      window.Guacamole = Guacamole;
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f7fb;
        height: 100vh;
        overflow: hidden;
        padding: 20px;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
        height: calc(100vh - 40px);
      }
      .main {
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 20px;
        height: 100%;
      }
      .panel {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        height: 100%;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .form-group {
        margin-bottom: 18px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #444;
        font-size: 14px;
      }
      input,
      select {
        width: 100%;
        padding: 10px 12px;
        border: 2px solid #e0e0e0;
        border-radius: 6px;
        font-size: 14px;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: #667eea;
      }
      .btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 10px;
      }
      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }
      .btn-danger {
        background: #f44336;
        color: white;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #display {
        width: 100%;
        height: 700px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        overflow: hidden;
        background: #000;
        position: relative;
      }
      .status {
        padding: 12px 16px;
        margin-top: 15px;
        border-radius: 6px;
        font-size: 14px;
        display: none;
        border-left: 4px solid;
      }
      .status.show {
        display: block;
      }
      .status.info {
        background: #e3f2fd;
        color: #1976d2;
        border-left-color: #1976d2;
      }
      .status.error {
        background: #ffebee;
        color: #c62828;
        border-left-color: #c62828;
      }
      .status.success {
        background: #e8f5e9;
        color: #2e7d32;
        border-left-color: #2e7d32;
      }
      .protocol-fields {
        display: none;
      }
      .protocol-fields.active {
        display: block;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      .row .form-group {
        flex: 1;
      }
      .stats {
        margin-top: 20px;
        padding: 15px;
        background: #f5f5f5;
        border-radius: 6px;
        font-size: 13px;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .placeholder {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #888;
      }
      .settings-body {
        flex: 1;
        overflow-y: auto;
        padding-right: 4px;
      }
      .settings-actions {
        position: sticky;
        bottom: 0;
        background: white;
        padding-top: 10px;
      }
      #display {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="main">
        <div class="panel">
          <h2 style="margin-bottom: 20px; color: #333">Connection Settings</h2>
          <div class="settings-body">
            <div class="form-group">
              <label>Protocol</label>
              <select id="protocol" onchange="switchProtocol()">
                <option value="rdp">RDP</option>
                <option value="vnc">VNC</option>
                <option value="ssh">SSH</option>
              </select>
            </div>

            <div id="rdp-fields" class="protocol-fields active">
              <div class="form-group">
                <label>Hostname *</label>
                <input type="text" id="rdp-hostname" value="rdp" />
              </div>
              <div class="form-group">
                <label>Port</label>
                <input type="number" id="rdp-port" value="3389" />
              </div>
              <div class="form-group">
                <label>Username</label>
                <input type="text" id="rdp-username" value="rdpuser" />
              </div>
              <div class="form-group">
                <label>Password</label>
                <input type="password" id="rdp-password" value="Passw0rd!" />
              </div>
              <div class="form-group">
                <label>Domain</label>
                <input type="text" id="rdp-domain" placeholder="Optional" />
              </div>
              <div class="row">
                <div class="form-group">
                  <label>Width</label>
                  <input type="number" id="rdp-width" value="1280" />
                </div>
                <div class="form-group">
                  <label>Height</label>
                  <input type="number" id="rdp-height" value="720" />
                </div>
              </div>
              <div class="row">
                <div class="form-group">
                  <label>Security</label>
                  <select id="rdp-security">
                    <option value="any">any (auto)</option>
                    <option value="nla">nla</option>
                    <option value="tls">tls</option>
                    <option value="rdp">rdp</option>
                    <option value="vmconnect">vmconnect</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Ignore Cert</label>
                  <select id="rdp-ignore-cert">
                    <option value="true" selected>true</option>
                    <option value="false">false</option>
                  </select>
                </div>
              </div>
            </div>

            <div id="vnc-fields" class="protocol-fields">
              <div class="form-group">
                <label>Hostname *</label>
                <input type="text" id="vnc-hostname" value="rdp" />
              </div>
              <div class="form-group">
                <label>Port</label>
                <input type="number" id="vnc-port" value="5900" />
              </div>
              <div class="form-group">
                <label>Password</label>
                <input type="password" id="vnc-password" />
              </div>
            </div>

            <div id="ssh-fields" class="protocol-fields">
              <div class="form-group">
                <label>Hostname *</label>
                <input type="text" id="ssh-hostname" value="rdp" />
              </div>
              <div class="form-group">
                <label>Port</label>
                <input type="number" id="ssh-port" value="22" />
              </div>
              <div class="form-group">
                <label>Username</label>
                <input type="text" id="ssh-username" value="root" />
              </div>
              <div class="form-group">
                <label>Password</label>
                <input type="password" id="ssh-password" />
              </div>
            </div>
          </div>

          <div class="settings-actions">
            <button class="btn btn-primary" onclick="connect()" id="connectBtn">Connect</button>
            <button class="btn btn-danger" onclick="disconnect()" id="disconnectBtn" disabled>
              Disconnect
            </button>
            <div id="status" class="status"></div>
          </div>

        </div>

        <div class="panel">
          <div id="display">
            <div class="placeholder">
              <div>Click Connect to start</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let client = null;
      let tunnel = null;

      function switchProtocol() {
        const protocol = document.getElementById('protocol').value;
        document
          .querySelectorAll('.protocol-fields')
          .forEach((el) => el.classList.remove('active'));
        document.getElementById(protocol + '-fields').classList.add('active');
      }

      function showStatus(msg, type = 'info') {
        const status = document.getElementById('status');
        status.textContent = msg;
        status.className = 'status show ' + type;
      }

      async function updateStats() {
        try {
          const res = await fetch('/api/stats');
          const data = await res.json();
          document.getElementById('activeConnections').textContent = data.activeConnections;
        } catch (e) {}
      }

      async function connect() {
        const protocol = document.getElementById('protocol').value;
        const params = { protocol };

        if (protocol === 'rdp') {
          if (!document.getElementById('rdp-width').value || !document.getElementById('rdp-height').value) {
            setDefaultResolution();
          }
          params.hostname = document.getElementById('rdp-hostname').value;
          params.port = parseInt(document.getElementById('rdp-port').value);
          params.username = document.getElementById('rdp-username').value;
          params.password = document.getElementById('rdp-password').value;
          params.domain = document.getElementById('rdp-domain').value;
          params.width = parseInt(document.getElementById('rdp-width').value);
          params.height = parseInt(document.getElementById('rdp-height').value);
          params.security = document.getElementById('rdp-security').value;
          params['ignore-cert'] = document.getElementById('rdp-ignore-cert').value === 'true';
        } else if (protocol === 'vnc') {
          params.hostname = document.getElementById('vnc-hostname').value;
          params.port = parseInt(document.getElementById('vnc-port').value);
          params.password = document.getElementById('vnc-password').value;
        } else if (protocol === 'ssh') {
          params.hostname = document.getElementById('ssh-hostname').value;
          params.port = parseInt(document.getElementById('ssh-port').value);
          params.username = document.getElementById('ssh-username').value;
          params.password = document.getElementById('ssh-password').value;
        }

        try {
          showStatus('Generating session...', 'info');
          document.getElementById('connectBtn').disabled = true;

          const res = await fetch('/api/session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(params),
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed');

          showStatus('Connecting...', 'info');

          const display = document.getElementById('display');
          display.innerHTML = '';

          const wsUrl = data.wsUrl;
          const sessionId = data.sessionId;
          if (!wsUrl || !sessionId) throw new Error('Missing sessionId or wsUrl from server');

          // Split base URL and query params to avoid double "?" additions by the tunnel
          const [wsBase, queryPart] = wsUrl.split('?');
          const connectParams = queryPart || `sessionId=${encodeURIComponent(sessionId)}`;

          tunnel = new Guacamole.WebSocketTunnel(wsBase);
          client = new Guacamole.Client(tunnel);
          display.appendChild(client.getDisplay().getElement());

          tunnel.onstatechange = (state) => {
            if (state === Guacamole.Tunnel.State.OPEN) {
              showStatus('Connected!', 'success');
              document.getElementById('disconnectBtn').disabled = false;
              updateStats();
            } else if (state === Guacamole.Tunnel.State.CLOSED) {
              showStatus('Disconnected', 'info');
              document.getElementById('connectBtn').disabled = false;
              document.getElementById('disconnectBtn').disabled = true;
              updateStats();
            }
          };

          client.onerror = (error) => {
            showStatus('Error: ' + error.message, 'error');
          };

          client.connect(connectParams);

          // Send initial display size to server to avoid 0x0 resolution
          const setSize = () => {
            const displayRect = display.getBoundingClientRect();
            const w = Math.floor(displayRect.width);
            const h = Math.floor(displayRect.height);
            client.sendSize(w, h);
          };
          setSize();
          window.addEventListener('resize', setSize);

          const keyboard = new Guacamole.Keyboard(document);
          keyboard.onkeydown = (k) => client.sendKeyEvent(1, k);
          keyboard.onkeyup = (k) => client.sendKeyEvent(0, k);

          const mouse = new Guacamole.Mouse(client.getDisplay().getElement());
          mouse.onmousedown =
            mouse.onmouseup =
            mouse.onmousemove =
              (m) => {
                client.sendMouseState(m);
              };
        } catch (error) {
          showStatus('Error: ' + error.message, 'error');
          document.getElementById('connectBtn').disabled = false;
        }
      }

      function disconnect() {
        if (client) client.disconnect();
        if (tunnel) tunnel.disconnect();
        document.getElementById('display').innerHTML =
          '<div class="placeholder"><div>Click Connect to start</div></div>';
        showStatus('Disconnected', 'info');
        document.getElementById('connectBtn').disabled = false;
        document.getElementById('disconnectBtn').disabled = true;
      }

      function setDefaultResolution() {
        const displayRect = document.getElementById('display').getBoundingClientRect();
        const width = Math.floor(displayRect.width);
        const height = Math.floor(displayRect.height);
        document.getElementById('rdp-width').value = width;
        document.getElementById('rdp-height').value = height;
      }

      setDefaultResolution();
      setInterval(updateStats, 5000);
      updateStats();
    </script>
  </body>
</html>
